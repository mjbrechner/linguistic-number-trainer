<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Linguistic Number Trainer</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="images/profile-pic.png">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1>Linguistic Number Trainer</h1>
        <h3>Trainer for numbers in various languages. Type in the answer in the target language!</h3>
    </header>

    <div id="language-section">
        <div class="language" id="language-spanish" onclick="languageChange(); languageSelectSpanish()">Español</div>
        <div class="language" id="language-english" onclick="languageChange(); languageSelectEnglish()">English</div>
        <div class="language" id="language-japanese" onclick="languageChange(); languageSelectJapanese()">日本語</div>
    </div>

    <main>
        <div class="number-box">
            <div id="number-in-question"></div>
            <textarea name="" id="input-area" maxlength="13" autofocus></textarea>
            <!-- Max length needs to be 31 for British English numbers 0-1000 but only 13 for 0-100 for all Englishes. -->
        </div>
        <div class="timer">
            <div id="timer-display">Time: 0</div>
        </div>
        <div class="timer-average">
            <div id="timer-average-display">Time Average: 0</div>
        </div>

        <div id="notification-box"></div>
    </main>

    <footer>
        <p>
            <script>
                const thisYear = new Date().getFullYear();
                if (thisYear === 2026) {
                    document.write(`Copyright © 2026 `);
                } else {
                    document.write(`Copyright © 2026-${thisYear} `);
                }
            </script>
            <a class="credits-link" href="https://github.com/mjbrechner">M.J. Brechner</a>
        </p>
    </footer>
    <script src="javascript/number-dictionary.js" defer></script>
    <script src="javascript/index.js" defer></script>
</body>

</html>
